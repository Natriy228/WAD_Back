services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: natriy
      POSTGRES_PASSWORD: User1298
      POSTGRES_DB: waves_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: